# 第二轮：抓"崩溃时刻"的全内存 + 异常地址 + 存活期快照
name: win-probe2

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/win_probe2.ps1'
      - '.github/workflows/win-probe2.yml'

jobs:
  probe2:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: 取 procdump
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Procdump.zip' -OutFile tools\procdump.zip
          Expand-Archive tools\procdump.zip -DestinationPath tools -Force

      - name: 崩溃内存采集
        shell: pwsh
        run: |
          ./scripts/win_probe2.ps1 -Exe 'samples\HWIDMaster-0902.exe' -Procdump 'tools\procdump64.exe' -OutDir 'probe2'

      - name: 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe2-report
          path: |
            probe2/**
            !probe2/dumps/**
            !probe2/patched/**
          if-no-files-found: warn

      - name: 内存转储
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe2-dumps
          path: probe2/dumps/*.dmp
          if-no-files-found: ignore
          compression-level: 0
